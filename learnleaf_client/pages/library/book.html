<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/common/base.css?v=20260826-5">
    <link rel="stylesheet" href="../../styles/common/message.css">
    <link rel="stylesheet" href="../../styles/pages/book.css?v=20260826-15">
    <title>Book | LearnLeaf</title>
</head>
<body>
    <a class="back-to-folders" href="my_folders.html" aria-label="Back to My Folders" title="Back to My Folders">
        <svg viewBox="0 0 32 26" aria-hidden="true" focusable="false">
            <path d="M11 5.5 1.5 13 11 20.5V16h8a6 6 0 1 0 0-12h-4v4h4a2 2 0 1 1 0 4h-8V5.5Z"/>
        </svg>

    <main class="book-page">
        <div class="reader-layout">
            <div class="reader-side reader-side-left"></div>

            <section class="epub-reader">
                <div class="reader-topbar">
                    <p class="reader-label">LearnLeaf Reader</p>
                    <h1 id="book-title"></h1>
                    <p class="page-counter" id="page-counter">Reading progress: 0%</p>
                </div>

                <div class="reader-control">
                    <div class="epub-render" id="epub-render"></div>
                </div>
            </section>

            <div class="reader-side reader-side-right">
                <button type="button" id="ask-ai-button">Ask LearnLeaf AI</button>
            </div>
        </div>
    </main>

    <footer class="book-footer">
        <p>LearnLeaf Reader</p>
    </footer>

    <script src="../../scripts/common/jszip.min.js"></script>
    <script src="../../scripts/common/epub.min.js"></script>
    <script src="../../scripts/common/axios.min.js"></script>
    <script src="../../scripts/common/env.js"></script>
    <script src="../../scripts/common/auth_guard.js"></script>
    <script src="../../scripts/common/helper.js"></script>
    <script src="../../scripts/pages/book.js"></script>
